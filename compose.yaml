name: just-chill
services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    container_name: just-chill-falkordb
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:13000:3000"
    environment:
      REDIS_ARGS: "--dir /var/lib/falkordb/data --appendonly yes --appendfsync everysec"
    volumes:
      - graph-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  graph-data:

